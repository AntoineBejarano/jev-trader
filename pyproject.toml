[project]
name = "jev-trader"
version = "0.1.0"
description = "Instrument-agnostic autonomous trading agent driven by TypeSafe Jev."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "websockets>=15.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.21",
    "asyncpg>=0.30",
    "greenlet>=3.2",
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "mypy>=1.17",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "ruff>=0.12",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: hits live public market data; skipped by default",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM105"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["src"]
warn_unused_ignores = true
show_error_codes = true
